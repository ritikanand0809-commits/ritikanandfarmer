<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Yield Analyzer — AI-Powered Agricultural Intelligence</title>
  <meta name="description" content="Predict crop yields, analyze historical trends, and optimize farm performance with AI-powered agricultural intelligence. Built for farmers, agronomists, and researchers." />
  <meta name="theme-color" content="#0d1117" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
